<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background Circle (Teal / Blue-Cyan) -->
  <circle cx="50" cy="50" r="48" fill="#0E7490" />
  
  <!-- Subtle Inner Border Highlight -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.3" />

  <!-- Sheet Paper / Checkbox List -->
  <g transform="translate(18, 22)">
    <!-- Checklist Item 1 -->
    <circle cx="12" cy="12" r="9" fill="none" stroke="#E0F2FE" stroke-width="2.5" />
    <path d="M8 12 L11 15 L16 9" fill="none" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="26" y="9" width="34" height="5" rx="2.5" fill="#BAE6FD" opacity="0.85" />
    <rect x="26" y="17" width="22" height="3.5" rx="1.75" fill="#7DD3FC" opacity="0.6" />

    <!-- Checklist Item 2 -->
    <circle cx="12" cy="38" r="9" fill="none" stroke="#E0F2FE" stroke-width="2.5" />
    <circle cx="12" cy="38" r="3" fill="#FDE047" />
    <rect x="26" y="35" width="34" height="5" rx="2.5" fill="#BAE6FD" opacity="0.85" />
    <rect x="26" y="43" width="18" height="3.5" rx="1.75" fill="#7DD3FC" opacity="0.6" />
  </g>

  <!-- Pencil Lying Diagonally (Angled from top-right to bottom-left) -->
  <g transform="translate(48, 48) rotate(-42) translate(-48, -48)">
    <!-- Shadow -->
    <rect x="46" y="18" width="14" height="58" rx="4" fill="#083344" opacity="0.3" transform="translate(2, 2)" />
    
    <!-- Eraser (Red/Coral) -->
    <rect x="46" y="16" width="12" height="10" rx="3" fill="#F87171" />
    
    <!-- Metal Ferrule (Silver) -->
    <rect x="46" y="24" width="12" height="6" fill="#CBD5E1" />
    <line x1="46" y1="27" x2="58" y2="27" stroke="#94A3B8" stroke-width="1" />

    <!-- Pencil Body (Vibrant Yellow / Orange Gold) -->
    <rect x="46" y="30" width="12" height="34" fill="#F59E0B" />
    <!-- Yellow highlight stripe -->
    <rect x="50" y="30" width="4" height="34" fill="#FBBF24" />

    <!-- Pencil Wood Tip -->
    <polygon points="46,64 58,64 52,76" fill="#FED7AA" />

    <!-- Graphite Lead Tip -->
    <polygon points="49.5,71 54.5,71 52,76" fill="#1E293B" />
  </g>
</svg>
