<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="liveCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF1F2"/>
    </linearGradient>
    <linearGradient id="liveHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="livePdfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="liveSealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="liveSheetShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#881337" flood-opacity="0.16"/>
    </filter>
  </defs>
  <!-- Background Sheet -->
  <rect x="150" y="40" width="270" height="340" rx="20" fill="#FEE2E2" transform="rotate(-6 285 210)"/>
  <!-- Main Sheet -->
  <rect x="165" y="40" width="270" height="340" rx="20" fill="url(#liveCardGrad)" filter="url(#liveSheetShadow)"/>
  <!-- Top Header Bar (Red) -->
  <rect x="165" y="40" width="270" height="60" rx="20" fill="url(#liveHeaderGrad)"/>
  <rect x="165" y="80" width="270" height="20" fill="url(#liveHeaderGrad)"/>
  <text x="300" y="78" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="17" fill="#FFFFFF" letter-spacing="1">LIVE EXAM (PDF)</text>
  
  <!-- PDF Badge on Sheet -->
  <rect x="190" y="115" width="46" height="26" rx="6" fill="url(#livePdfGrad)"/>
  <text x="213" y="133" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="13" fill="#FFFFFF">PDF</text>
  <rect x="246" y="121" width="130" height="14" rx="7" fill="#CBD5E1"/>

  <!-- Content Rows -->
  <g transform="translate(190, 160)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="20" height="20" rx="5" fill="#10B981"/>
    <path d="M5 10 L8 13 L15 6" stroke="#FFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="30" y="4" width="165" height="12" rx="6" fill="#E2E8F0"/>
    
    <!-- Row 2 -->
    <rect x="0" y="32" width="20" height="20" rx="5" fill="#10B981"/>
    <path d="M5 42 L8 45 L15 38" stroke="#FFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="30" y="36" width="145" height="12" rx="6" fill="#E2E8F0"/>
    
    <!-- Row 3 -->
    <rect x="0" y="64" width="20" height="20" rx="5" fill="#10B981"/>
    <path d="M5 74 L8 77 L15 70" stroke="#FFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="30" y="68" width="175" height="12" rx="6" fill="#E2E8F0"/>

    <!-- Row 4 -->
    <rect x="0" y="96" width="20" height="20" rx="5" fill="#10B981"/>
    <path d="M5 106 L8 109 L15 102" stroke="#FFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="30" y="100" width="135" height="12" rx="6" fill="#E2E8F0"/>
  </g>

  <!-- Passed Official Seal -->
  <circle cx="390" cy="330" r="48" fill="url(#liveSealGrad)" filter="url(#liveSheetShadow)"/>
  <circle cx="390" cy="330" r="42" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="390" y="326" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF">OFFICIAL</text>
  <text x="390" y="344" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="12" fill="#FEF08A">IDONEO</text>
</svg>
